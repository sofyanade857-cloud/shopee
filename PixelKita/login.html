<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk Akun - shopupedia</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">shopupedia <span>temukan. pilih.percaya</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Beranda</a></li>
        <li><a href="produk.html">Produk & Jasa</a></li>
      </ul>
    </div>
  </header>

  <main class="container" style="display: flex; align-items: center; justify-content: center; min-height: 70vh;">
    <div style="background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 2.2rem; width: 100%; max-width: 420px; box-shadow: var(--shadow);">
      <h2 style="color: var(--secondary); text-align: center; margin-bottom: 0.5rem;">Masuk Akun</h2>
      <p style="color: var(--text-muted); text-align: center; font-size: 0.9rem; margin-bottom: 1.8rem;">Gunakan akun simulasi Admin atau Customer.</p>

      <form id="form-login">
        <div class="form-group">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" class="form-control" required placeholder="admin / customer">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" required placeholder="admin123 / customer123">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem;">
          Masuk Sekarang
        </button>
      </form>

      <div style="background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 0.8rem; margin-top: 1.5rem; font-size: 0.82rem; color: var(--text-muted);">
        <strong>Demo Login:</strong><br>
        • Admin: <code>admin</code> / <code>admin123</code> (Buka Dashboard)<br>
        • Customer: <code>customer</code> / <code>customer123</code> (Belanja)
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 PixelKita Studio.</p>
  </footer>

  <script src="js/app.js"></script>
  <script>
    document.getElementById("form-login").addEventListener("submit", (e) => {
      e.preventDefault();
      const u = document.getElementById("login-username").value.trim();
      const p = document.getElementById("login-password").value.trim();

      if (u === "admin" && p === "admin123") {
        localStorage.setItem("pixel_user", JSON.stringify({ username: "admin", role: "admin" }));
        alert("Berhasil login sebagai Admin!");
        window.location.href = "dashboard.html";
      } else if (u === "customer" && p === "customer123") {
        localStorage.setItem("pixel_user", JSON.stringify({ username: "customer", role: "customer" }));
        alert("Berhasil login sebagai Customer!");
        window.location.href = "produk.html";
      } else {
        alert("Username atau password salah!");
      }
    });
  </script>
</body>
</html>
